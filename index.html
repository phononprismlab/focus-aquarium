<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鱼儿乐水族馆 · V0.2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #d7f0f4;
    color: #24353a;
  }

  .app {
    width: 100vw; 
    height: 100vh;
    display: flex; 
    align-items: center; 
    justify-content: center;
    padding: 0;
  }

  .tank {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(to bottom, #8bcbd9 0%, #9dd4dc 66%, #a9d6ce 100%);
    isolation: isolate;
    cursor: default;
    user-select: none;
    touch-action: none;
  }

  .water-glow, .sand, .plant, .leaf {
    pointer-events: none !important;
  }

  .water-glow {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 50% 18%, rgba(255,255,255,.16), transparent 42%),
      linear-gradient(to bottom, transparent 65%, rgba(83,142,130,.10));
  }

  /* 升级版海报标题：纯白高对比度 + 立体阴影浮雕感 */
  .poster-title {
    position: absolute;
    top: 5.5%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    margin: 0;
    font-size: clamp(24px, 5.5vw, 54px);
    white-space: nowrap;
    font-weight: 900;
    letter-spacing: 0.22em;
    padding-left: 0.22em; /* 居中校正 letter-spacing 的偏移 */
    pointer-events: none;
    
    /* 改为纯白实色，增强清晰度 */
    color: #ffffff;
    
    /* 强对比水体阴影，确保在任何水色背景下都极为清晰 */
    filter: drop-shadow(0 2px 8px rgba(16, 52, 60, 0.45))
            drop-shadow(0 0 20px rgba(255, 255, 255, 0.4));
    
    will-change: transform, opacity, filter;
  }

  /* 泡泡破裂消散动画 */
  .poster-title.bubble-dissolve {
    animation: bubbleUpDissolve 0.85s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  /* 泡泡生成淡入恢复动画 */
  .poster-title.bubble-appear {
    animation: bubbleIn 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes bubbleUpDissolve {
    0% {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      filter: drop-shadow(0 2px 8px rgba(16, 52, 60, 0.45)) blur(0px);
    }
    50% {
      opacity: 0.7;
      filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.8)) blur(2px);
    }
    100% {
      opacity: 0;
      transform: translateX(-50%) translateY(-55px) scale(1.3);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0)) blur(8px);
    }
  }

  @keyframes bubbleIn {
    0% {
      opacity: 0;
      transform: translateX(-50%) translateY(20px) scale(0.85);
      filter: blur(6px);
    }
    100% {
      opacity: 1;
      transform: translateX(-50%) translateY(0) scale(1);
      filter: drop-shadow(0 2px 8px rgba(16, 52, 60, 0.45)) drop-shadow(0 0 20px rgba(255, 255, 255, 0.4)) blur(0px);
    }
  }

  .sand {
    position: absolute; left: 0; right: 0; bottom: 0; height: 19%; z-index: 2;
    background:
      radial-gradient(circle at 15% 35%, rgba(151,121,68,.10) 0 1px, transparent 2px),
      radial-gradient(circle at 72% 65%, rgba(151,121,68,.08) 0 1px, transparent 2px),
      #dfcb92;
    background-size: 38px 31px, 47px 39px, auto;
  }

  .plant { position: absolute; bottom: 10.5%; width: 100px; height: 25%; z-index: 3; }
  .plant.left { left: 5%; }
  .plant.right { right: 5%; transform: scaleX(-1); }

  .leaf {
    position: absolute; bottom: 0; width: 14px; height: 72%;
    border-radius: 100% 0 100% 0; background: #4f8c6e; transform-origin: bottom center;
  }
  .leaf:nth-child(1) { left: 10px; transform: rotate(-28deg); height: 66%; }
  .leaf:nth-child(2) { left: 30px; transform: rotate(-5deg); height: 92%; }
  .leaf:nth-child(3) { left: 50px; transform: rotate(29deg); height: 58%; }
  .leaf:nth-child(4) { left: 25px; transform: rotate(20deg); height: 46%; opacity: .9; }

  .fish {
    position: absolute; left: 0; top: 0; width: 116px; height: 70px;
    transform-origin: 50% 50%; z-index: 5; cursor: pointer; will-change: transform;
  }

  .fish-body {
    position: absolute; left: 5px; top: 15px; width: 77px; height: 42px;
    border-radius: 58% 48% 48% 56%; background: #f39b68;
    box-shadow: inset -8px -5px 0 rgba(206, 104, 65, .16);
    overflow: hidden;
  }

  .fish-body::before {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to top, #ffffff 60%, rgba(255, 255, 255, 0) 100%);
    border-radius: 0 0 50% 50%;
  }

  .fish-body::after {
    content: ""; position: absolute; left: 12px; top: 10px;
    width: 9px; height: 9px; border-radius: 50%; background: #243c42;
    box-shadow: 0 0 0 2px #ffffff;
    z-index: 2;
  }

  .fish-tail {
    position: absolute; left: 76px; top: 21px; width: 36px; height: 31px;
    background: #df7850; clip-path: polygon(0 50%, 100% 0, 88% 100%); 
    transform-origin: 0% 50%;
    will-change: transform;
  }

  .fish-fin {
    position: absolute; left: 40px; top: 2px; width: 27px; height: 28px;
    border-radius: 100% 0 100% 0; background: #e77e58; 
    transform-origin: bottom left;
    will-change: transform;
  }

  .fish.small { width: 74px; height: 46px; }
  .fish.small .fish-body { left: 3px; top: 10px; width: 49px; height: 28px; }
  .fish.small .fish-body::after { left: 8px; top: 6px; width: 6px; height: 6px; box-shadow: 0 0 0 1.5px #ffffff; }
  .fish.small .fish-tail { left: 48px; top: 14px; width: 24px; height: 21px; }
  .fish.small .fish-fin { left: 26px; top: 1px; width: 18px; height: 18px; }

  .feed-pellet {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffffff, #f39b68);
    box-shadow: 0 0 8px rgba(0,0,0,0.4); z-index: 99;
    pointer-events: none; transform: translate(-50%, -50%);
  }
  .feed-pellet.eaten {
    transition: all .15s ease-out; opacity: 0; transform: translate(-50%, -50%) scale(0.1);
  }

  /* 圆形水泡计时器 */
  .timer {
    position: absolute; z-index: 1000; left: 50%; top: 53%;
    transform: translate(-50%, -50%);
    width: min(260px, 70vw); 
    height: min(260px, 70vw);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    
    background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.85) 0%, rgba(240, 250, 252, 0.65) 50%, rgba(180, 225, 235, 0.45) 100%);
    box-shadow: 
      inset -10px -10px 20px rgba(255, 255, 255, 0.9),
      inset 10px 10px 20px rgba(70, 130, 140, 0.25),
      0 12px 35px rgba(36, 68, 75, 0.18);
    backdrop-filter: blur(6px);
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    text-align: center;

    animation: bubbleFloat 4s ease-in-out infinite alternate;
  }

  .timer::before {
    content: "";
    position: absolute;
    top: 14%;
    left: 20%;
    width: 25%;
    height: 12%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.65);
    transform: rotate(-35deg);
    pointer-events: none;
  }

  @keyframes bubbleFloat {
    0% { transform: translate(-50%, -50%) translateY(3px) scale(.985); }
    50% { transform: translate(-50%, -50%) translateY(-7px) scale(1.012); }
    100% { transform: translate(-50%, -50%) translateY(-15px) scale(1.025); }
  }

  .mode { font-size: 13px; letter-spacing: .1em; color: #435b60; margin-bottom: 4px; }
  .time { display: block; font-size: clamp(38px, 5.5vw, 52px); line-height: 1; font-weight: 700; color: #101b1e; cursor: ns-resize; margin: 4px 0; }
  .time-sub { font-size: 11px; color: #5a7378; max-width: 85%; }

  .start, .end {
    margin-top: 10px; border: 0; border-radius: 20px; padding: 7px 18px;
    background: #4d8a8c; color: white; font-size: 13px; cursor: pointer;
    box-shadow: 0 4px 10px rgba(77, 138, 140, 0.3);
    transition: transform .1s ease, background .2s ease;
  }
  .start:hover, .end:hover { transform: scale(1.05); }
  .end { display: none; background: #667f82; }

  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 1001; background: rgba(22, 46, 50, .20); }
  .modal.show { display: flex; }
  .modal-card { width: min(340px, calc(100vw - 40px)); padding: 27px; border-radius: 22px; background: #f6fbfb; text-align: center; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
  .modal-actions button { border: 0; border-radius: 11px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .continue { background: #e1eeee; color: #3d5559; }
  .confirm { background: #5a8588; color: white; }

  .completion-flash {
    position:absolute; left:50%; top:53%; z-index:1100;
    transform:translate(-50%,-50%) scale(.88);
    min-width:min(330px,78vw); padding:20px 28px; border-radius:24px;
    background:rgba(246,251,251,.90); border:1px solid rgba(255,255,255,.9);
    box-shadow:0 14px 45px rgba(36,68,75,.22),0 0 45px rgba(255,255,255,.42);
    backdrop-filter:blur(10px); text-align:center; opacity:0; pointer-events:none;
  }
  .completion-flash.show { opacity:1; pointer-events:auto; animation:none; }
  .completion-main { font-size:clamp(22px,4vw,30px); font-weight:800; letter-spacing:.08em; color:#24353a; }
  .completion-sub { margin-top:7px; font-size:12px; color:#5a7378; }
  .timer.complete-pulse { animation:completionPulse 1.05s ease-in-out 3; }
  @keyframes completionFlash {
    0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}
    12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}
    22%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-54%) scale(.96)}
  }
  @keyframes completionPulse {
    0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1)}
    50%{transform:translate(-50%,-50%) translateY(-13px) scale(1.045)}
  }
  @media (max-width:520px) {
    .poster-title{top:4.5%;font-size:clamp(21px,7vw,31px);letter-spacing:.12em;padding-left:.12em}
    .timer{width:min(230px,62vw);height:min(230px,62vw)}
  }



/* 1. 统一控制组包裹容器（定位在鱼缸右顶角） */
.audio-controls {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 0;
  height: 52px;
  padding: 6px;
  border: 1px solid rgba(255, 255, 255, 0.58);
  border-radius: 999px;
  background: rgba(30, 80, 95, 0.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
}

.audio-controls button {
  border: 0;
  background: transparent;
  color: #fff;
  cursor: pointer;
  user-select: none;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
}

.audio-toggle {
  width: 54px;
  height: 40px;
  padding: 0;
  border-radius: 999px;
  font-size: 21px;
}

.audio-settings-toggle {
  width: 42px;
  height: 40px;
  padding: 0;
  border-radius: 999px;
  font-size: 19px;
  letter-spacing: 2px;
}

.audio-controls button:hover { background: rgba(255, 255, 255, 0.12); }
.audio-controls button:active { transform: scale(0.97); }

/* 2. 调音面板（挂载在按钮胶囊框下方） */
.audio-settings {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  z-index: 999;
  width: min(270px, calc(100vw - 36px));
  box-sizing: border-box;
  padding: 16px 17px 15px;
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 16px;
  background: rgba(20, 65, 78, 0.58);
  color: #fff;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  opacity: 0;
  transform: translateY(-8px) scale(0.98);
  pointer-events: none;
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.audio-settings.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.audio-settings-title { margin-bottom: 13px; font-size: 13px; letter-spacing: 0.14em; opacity: 0.95; }
.audio-slider-row + .audio-slider-row { margin-top: 14px; }
.audio-slider-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 12px; letter-spacing: 0.06em; }
.audio-slider-label span:last-child { opacity: 0.78; font-variant-numeric: tabular-nums; }
.audio-settings input[type="range"] { display: block; width: 100%; height: 4px; margin: 0; accent-color: #fff; cursor: pointer; }

/* 3. 移动端响应式尺寸调整 */
@media (max-width: 600px) {
  .audio-controls { top: 12px; right: 12px; height: 48px; padding: 5px; }
  .audio-toggle { width: 50px; height: 38px; font-size: 20px; }
  .audio-settings-toggle { width: 40px; height: 38px; font-size: 17px; }
  .audio-settings { top: calc(100% + 6px); right: 0; width: min(270px, calc(100vw - 24px)); }
}

.completion-flash{

</style>
</head>

  async function loadPublishedConfig(){
    // 每一项单独接住网络异常，这样才能说清到底是哪一类配置没加载，
    // 也能让加载成功的部分正常生效，而不是整批作废。
    // 包一层 Promise.resolve()：fetch 万一同步抛错也能被接住，
    // 否则用户会看到浏览器原始的 "Failed to fetch" 而不是能看懂的中文提示。
    const safeFetch = path => Promise.resolve()
      .then(() => fetch(`${API_BASE}${path}`, { cache:"no-store" }))
      .catch(() => null);
    const [decorationsResponse, fishResponse, focusResponse, audioResponse] = await Promise.all([
      safeFetch("/game/decorations"),
      safeFetch("/game/fish"),
      safeFetch("/game/focus"),
      safeFetch("/game/audio")
    ]);
    const usable = response => Boolean(response && response.ok);
    const failed = [];
    if(!usable(decorationsResponse)) failed.push("装饰");
    if(!usable(fishResponse)) failed.push("鱼种");
    if(!usable(focusResponse)) failed.push("专注配置");
    const audioFailed = !usable(audioResponse);

    if(usable(decorationsResponse)){
      try{
        const decorations = await decorationsResponse.json();
        if(decorations.data.length) SHOP_ITEMS = decorations.data.map(record => record.data);
      }catch(_){ failed.push("装饰"); }
    }
    if(usable(fishResponse)){
      try{
        const fish = await fishResponse.json();
        FISH_ASSEMBLY = fish.data.map(record => record.data);
      }catch(_){ failed.push("鱼种"); }
    }
    if(usable(focusResponse)){
      try{
        const focus = await focusResponse.json();
        if(focus.data[0]) FOCUS_CONFIG = focus.data[0].data;
      }catch(_){ failed.push("专注配置"); }
    }
    if(!audioFailed){
      try{
        const audio = await audioResponse.json();
        const config = audio && audio.data && audio.data[0] ? audio.data[0].data : null;
        if(config && config.categories && Array.isArray(config.sounds)) AUDIO_CONFIG = config;
      }catch(_){ /* 音频配置解析失败时沿用内置音效 */ }
    }
    // 这三步属于音频的附加处理：它们出错只会导致没有声音，
    // 不应该被当成「配置加载失败」弹出吓人的提示条。
    try{
      applyServerAudioDefaults();
      normalizeAmbientSound();
      syncAmbientAudio();
    }catch(error){
      console.warn("应用音频配置失败，沿用内置音效：", error);
    }
    return { failed, audioFailed };
  }

  // 拉取配置并把结果反馈给用户；失败时不抛错，调用方照常继续渲染。
  async function syncPublishedConfig(){
    try{
      const result = await loadPublishedConfig();
      // 去重：failed 里可能因为解析失败出现重复项。
      const failed = Array.from(new Set(result.failed));
      if(!failed.length && !result.audioFailed){
        hideConfigNotice();
        return true;
      }
      const parts = [];
      if(failed.length) parts.push(`${failed.join("、")}未能加载，以下为内置默认内容，后台改动暂不生效`);
      if(result.audioFailed) parts.push("音频配置未加载，背景音沿用内置音效");
      showConfigNotice(`配置服务连接失败：${parts.join("；")}。`);
      return false;
    }catch(error){
      showConfigNotice(`配置加载失败：${error && error.message ? error.message : "未知错误"}。当前使用内置默认内容。`);
      return false;
    }
  }

  // 后台配置的背景音（category==="bgm"、已启用、且有音频文件）→ 商店「白噪音」分类的商品。
  // 价格/会员/描述优先沿用同 id 或同音频文件的旧商品，匹配不到则按免费处理。
  function serverSoundItems(){
    if(!AUDIO_CONFIG || !Array.isArray(AUDIO_CONFIG.sounds)) return [];
    return AUDIO_CONFIG.sounds
      .filter(sound => sound && sound.category === "bgm" && sound.enabled !== false && sound.resourcePath)
      .map(sound => {
        const legacy = SHOP_ITEMS.find(item => item.id === sound.id || item.resourcePath === sound.resourcePath) || {};
        return {
          id: sound.id,
          category: "sounds",
          name: sound.name || legacy.name || sound.id,
          description: legacy.description || "来自后台音频配置的背景音",
          previewImage: legacy.previewImage || "",
          price: Number.isFinite(Number(legacy.price)) ? Number(legacy.price) : 0,
          resourcePath: sound.resourcePath,
          isMemberOnly: legacy.isMemberOnly === true,
          maxInventory: 1,
          volume: Number(sound.volume)
        };
      });
  }
  // 商店统一数据源：背景音一律以后台音频配置为准，其余分类沿用商品配置。
  function currentShopItems(){
    const server = serverSoundItems();
    if(!server.length) return SHOP_ITEMS;
    return SHOP_ITEMS.filter(item => item.category !== "sounds").concat(server);
  }
  // 玩家第一次进入（本地没有音量偏好）时，用后台配置的分类音量作为默认值；已有偏好则不覆盖。
  function applyServerAudioDefaults(){
    if(!AUDIO_CONFIG || !AUDIO_CONFIG.categories) return;
    ["bgm", "prompt", "sfx"].forEach(key => {
      if(localStorage.getItem("fishTank_" + key + "Volume") !== null) return;
      const category = AUDIO_CONFIG.categories[key];
      if(!category) return;
      const volume = Number(category.volume);
      if(!Number.isFinite(volume)) return;
      audioVolumes[key] = Math.max(0, Math.min(100, volume));
    });
  }
  // 后台增删音效后，旧存档里指向已下线音效的 id 需要回落到第一个可用音效。
  function normalizeAmbientSound(){
    const list = serverSoundItems();
    if(!list.length) return;
    const target = AquariumData || null;
    if(!target) return;
    const current = target.ambientSound;
    if(current && list.some(sound => sound.id === current)) return;
    const first = list[0];
    target.ambientSound = first.id;
    if(PlayerData){
      PlayerData.inventory = PlayerData.inventory || {};
      PlayerData.inventory.sounds = PlayerData.inventory.sounds || {};
      if(!PlayerData.inventory.sounds[first.id]) PlayerData.inventory.sounds[first.id] = 1;
    }
  }

    const ids=[];
    (data.fish||[]).forEach(f=>{ if(!ids.includes(f.itemId)) ids.push(f.itemId); });

  function aquariumValue(data,item){

  function buildSettlement(data){
    let paid=0, refund=0, problems=[]; const rows=[];
    const currentFish={}, targetFish={};
    (AquariumData.fish||[]).forEach(f=>currentFish[f.itemId]=(currentFish[f.itemId]||0)+1);
    (data.fish||[]).forEach(f=>targetFish[f.itemId]=(targetFish[f.itemId]||0)+1);
    const ids=[...new Set([...Object.keys(currentFish),...Object.keys(targetFish),...getTargetIds(data)])];
    ids.map(getItem).filter(Boolean).forEach(item=>{
      const current=item.category==="fish"?(currentFish[item.id]||0):(aquariumValue(AquariumData,item)===item.id?1:0);
      const target=item.category==="fish"?(targetFish[item.id]||0):(aquariumValue(data,item)===item.id?1:0);
      const owned=getInv(item);
      const buy=item.category==="fish"?Math.max(0,target-owned):(target&&owned<=0?1:0);
      const sell=item.category==="fish"?Math.max(0,current-target):0;
      if(buy){
        if(item.isMemberOnly&&!PlayerData.isMember) problems.push(`${item.name}为会员限定商品`);
        if(owned+buy>item.maxInventory) problems.push(`${item.name}已达拥有上限`);
        paid+=buy*item.price; rows.push({name:item.name,qty:buy,price:buy*item.price,isMemberOnly:item.isMemberOnly});
      }
      if(sell){ refund+=sell*item.price; rows.push({name:`${item.name}返还`,qty:sell,price:-sell*item.price}); }
    });
    return {paid,refund,total:paid-refund,problems,rows};
  }

  // 鱼缸中的鱼继续使用原来的鱼模型与朝向/游动逻辑。
  let rebuildFishFromData=function(data){
    const existing=[...tank.querySelectorAll(".fish")];
    existing.forEach((el,i)=>{ if(i>=data.fish.length) el.remove(); });
    fishStates.length=0;

    data.fish.forEach((f,i)=>{
      let el=existing[i];
      if(!el) el=makeFishElement(null,f.instanceId);

      el.className=fishClassForItem(f.itemId);
      el.dataset.instanceId=f.instanceId;
      el.innerHTML='<div class="fish-body"></div><div class="fish-tail"></div><div class="fish-fin"></div>';

      const assembly=getFishAssembly(f.itemId);
      const scaleMin=Number(assembly?.scaleMin)||1;
      const scaleMax=Number(assembly?.scaleMax)||scaleMin;

      const state={
        el,
        tailEl:el.querySelector(".fish-tail"),
        finEl:el.querySelector(".fish-fin"),
        x:f.x||200,
        y:f.y||200,
        speed:assembly?.movementCode==="quick-swim"?2.5:2.2,
        burstSpeed:0,
        radius:i%2?22:32,
        eatDist:i%2?28:38,
        eatCooldown:0,
        facingLeft:true,
        swimTime:Math.random()*100,
        targetX:null,
        targetY:null,
        scale:scaleMin+Math.random()*Math.max(0,scaleMax-scaleMin)
      };

      el.onpointerdown=(e)=>{
        if(!running)return;
        e.stopPropagation();
        playFishStartleSound();
        state.burstSpeed=6;
      };
      fishStates.push(state);
    });
  };

  function focusRewardMinutes(mins,isMember){
    const wholeMinutes=Math.max(0,Math.floor(Number(mins)||0));
    const tiers=[...FOCUS_CONFIG.rewardTiers].sort((a,b)=>Number(a.endMinute)-Number(b.endMinute));
    let reward=0;
    let previousEnd=0;
    for(const tier of tiers){
      const endMinute=Number(tier.endMinute);
      if(!Number.isFinite(endMinute)||endMinute<=previousEnd) continue;
      const tierMinutes=Math.max(0,Math.min(wholeMinutes,endMinute)-previousEnd);
      const bubblesPerMinute=Number(isMember?tier.memberBubblePerMinute:tier.normalBubblePerMinute)||0;
      reward+=tierMinutes*bubblesPerMinute;
      previousEnd=endMinute;
      if(wholeMinutes<=endMinute) break;
    }
    return reward;
  }
  function grantFocusReward(){

  }


  let audioCtx = null;
  let masterGain = null;
  let bgmGain = null;
  let promptGain = null;
  let sfxGain = null;
  let audioMuted = false;

  const AUDIO_DEFAULTS = { bgm:100, prompt:100, sfx:100 };
  let audioVolumes = {
    bgm: Number(localStorage.getItem("fishTank_bgmVolume") ?? AUDIO_DEFAULTS.bgm),
    prompt: Number(localStorage.getItem("fishTank_promptVolume") ?? AUDIO_DEFAULTS.prompt),
    sfx: Number(localStorage.getItem("fishTank_sfxVolume") ?? AUDIO_DEFAULTS.sfx)
  };
  audioVolumes.bgm = Math.max(0, Math.min(100, audioVolumes.bgm));
  audioVolumes.prompt = Math.max(0, Math.min(100, audioVolumes.prompt));

  let waterAudio = null;

  const FALLBACK_AUDIO_SRC = (window.FISHTANK_ASSET_BASE || '') + 'assets/sounds/water-ambient.mp3';
  const withAssetBase = path => /^(https?:)?\/\//i.test(path || "") ? path : (window.FISHTANK_ASSET_BASE || '') + (path || "");
  // 后台分类开关与音量作为总控：关闭即静音，音量作为上限系数，再乘以玩家自己的滑块。
  function categoryScale(key){
    const category = AUDIO_CONFIG && AUDIO_CONFIG.categories ? AUDIO_CONFIG.categories[key] : null;
    if(!category) return 1;
    if(category.enabled === false) return 0;
    const volume = Number(category.volume);
    if(!Number.isFinite(volume)) return 1;
    return Math.max(0, Math.min(100, volume)) / 100;
  }
  function currentAmbientId(){ return (TempAquariumData && TempAquariumData.ambientSound) || (AquariumData && AquariumData.ambientSound) || ""; }
  // 装点鱼缸里选中的背景音 → 对应音频文件；找不到就回落到第一个可用音效，再回落到内置文件。
  function ambientSourceFor(id){
    const list = serverSoundItems();
    const sound = list.find(item => item.id === id) || list[0];
    return sound && sound.resourcePath ? withAssetBase(sound.resourcePath) : FALLBACK_AUDIO_SRC;
  }
  let ambientSrc = "";
  function syncAmbientAudio(){
    const src = ambientSourceFor(currentAmbientId());
    if(!src) return;
    if(!waterAudio){
      waterAudio = new Audio(src);
      waterAudio.loop = true;
      waterAudio.preload = "auto";
      waterAudio.volume = 0;
      waterAudio.muted = audioMuted;
      ambientSrc = src;
    } else if(ambientSrc !== src){
      ambientSrc = src;
      waterAudio.pause();
      waterAudio.src = src;
      waterAudio.load();
      waterAudio.muted = audioMuted;
    }
    if(audioMuted){ waterAudio.volume = 0; return; }
    const p = waterAudio.play();
    if(p && typeof p.then === "function") p.then(() => fadeInWater(1200)).catch(()=>{});
  }

  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return false;
      audioCtx = new Ctx();
      masterGain = audioCtx.createGain();
      bgmGain = audioCtx.createGain();
      promptGain = audioCtx.createGain();
      sfxGain = audioCtx.createGain();

      masterGain.gain.value = audioMuted ? 0 : 0.72;
      bgmGain.gain.value = audioVolumes.bgm / 100;
      promptGain.gain.value = audioVolumes.prompt / 100;
      sfxGain.gain.value = audioVolumes.sfx / 100;

      bgmGain.connect(masterGain);
      promptGain.connect(masterGain);
      sfxGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === "suspended") audioCtx.resume().catch(()=>{});
    return true;
  }

  function fadeInWater(duration=1800){
    if(!waterAudio || audioMuted) return;
    const start = performance.now();
    waterAudio.volume = 0;
    const fade = (now) => {
      if(!waterAudio || audioMuted) return;
      const t = Math.min(1, (now-start)/duration);
      const eased = t*t*(3-2*t);
      waterAudio.volume = 0.38 * (audioVolumes.bgm / 100) * categoryScale("bgm") * eased;
      if(t < 1) requestAnimationFrame(fade);
    };
    requestAnimationFrame(fade);
  }

  function startWaterNoise(){
    if(!waterAudio){
      waterAudio = new Audio(ambientSourceFor(currentAmbientId()));
      waterAudio.loop = true;
      waterAudio.preload = "auto";
      waterAudio.volume = 0;
      waterAudio.muted = audioMuted;
      ambientSrc = waterAudio.src;
    }

    if(audioMuted) return;

    const p = waterAudio.play();
    if(p && typeof p.then === "function"){
      p.then(() => {
        // 自动播放成功：从 0 开始淡入。
        fadeInWater(1800);
      }).catch(() => {
        // 浏览器禁止未经过用户手势的自动播放。
        // 将按钮状态同步为“已静音”，让下一次点击明确变成“开启声音”。
        audioMuted = true;
        waterAudio.muted = true;
        waterAudio.volume = 0;
        updateAudioButton();
      });
    }
  }

  function unlockAudio(){

    if(!audioMuted && waterAudio.paused){

      }
    }
  }

  function setAudioMuted(muted){
    audioMuted = muted;

    if(audioCtx && masterGain){
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.72, audioCtx.currentTime, 0.025);
    }

    if(waterAudio){
      if(muted){
        waterAudio.muted = true;
        waterAudio.volume = 0;
      }else{
        waterAudio.muted = false;
        const p = waterAudio.play();
        if(p && typeof p.then === "function"){
          p.then(() => fadeInWater(700)).catch(()=>{});
        }
      }
    }

    updateAudioButton();
  }

  function tone(freq, duration, type="sine", volume=0.14, when=0, category="sfx"){
    if(!ensureAudio() || audioMuted) return;

    const categoryGain =
      category === "prompt" ? promptGain :
      category === "bgm" ? bgmGain :
      sfxGain;
    if(!categoryGain) return;

    const now = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(Math.max(volume,0.001), now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(categoryGain);
    osc.start(now);
    osc.stop(now + duration + 0.03);
  }

    const min = Number(FOCUS_CONFIG.minFocusDuration);
    const max = Number(FOCUS_CONFIG.maxFocusDuration);
    return { min: Number.isFinite(min) ? min : 25, max: Number.isFinite(max) ? Math.max(min, max) : 120 };
  }

  function renderTime() {
    timeEl.textContent = `${String(Math.floor(remaining / 60)).padStart(2, "0")}:${String(remaining % 60).padStart(2, "0")}`;
  }

  timeEl.addEventListener("wheel", (e) => {
    if (running) return;
    e.preventDefault();
    const bounds = focusDurationBounds();
    minutes = Math.max(bounds.min, Math.min(bounds.max, minutes + (e.deltaY < 0 ? 1 : -1)));
    remaining = minutes * 60;
    renderTime();
  }, { passive: false });

  startBtn.onclick = () => {
    unlockAudio(); ensureAudio(); playStartSound();
    if (timerFrame) clearTimeout(timerFrame);
    running = true; 
    startedAt = Date.now(); 
    durationSeconds = minutes * 60;
    updateDevStatus();
    // 按文档：会员状态以点击“开始专注”瞬间为准。
    sessionIsMember = PlayerData.isMember;

    // 清除现有的呈现动画类，触发泡泡向上浮动消散动画
    appTitle.classList.remove("bubble-appear");
    appTitle.classList.add("bubble-dissolve");
    
    setTimeout(() => {
      if (running) appTitle.style.visibility = "hidden";
    }, 800);

    modeEl.textContent = "专注中"; 
    hintEl.textContent = "点击水面投喂，点击鱼儿加速";
    startBtn.style.display = "none"; 
    endBtn.style.display = "inline-block";

    const loop = () => {
      if (!running) return;
      remaining = Math.max(0, Math.ceil(durationSeconds - (Date.now() - startedAt) / 1000));
      renderTime();
      if (remaining > 0) {
        timerFrame = setTimeout(loop, document.hidden ? 1000 : 250);
      } else {
        resetFocus(true);
      }
    };
    loop();
  };

  endBtn.onclick = () => modal.classList.add("show");
  continueBtn.onclick = () => modal.classList.remove("show");
  completionConfirm.onclick = () => {
    completionFlash.classList.remove("show");
    completionFlash.setAttribute("aria-hidden","true");
  };

  confirmBtn.onclick = () => {
    modal.classList.remove("show"); 
    resetFocus(false);
  };

function resetFocus(completed) {
    // 在重置 remaining 之前计算实际已专注时间。
    const elapsedSeconds = Math.max(
      0,
      durationSeconds - remaining
    );
    const elapsedMinutes = Math.floor(elapsedSeconds / 60);

    running = false;
    if (timerFrame) {
      clearTimeout(timerFrame);
      timerFrame = 0;
    }
    updateDevStatus();

    appTitle.style.visibility = "visible";
    appTitle.classList.remove("bubble-dissolve");
    void appTitle.offsetWidth;
    appTitle.classList.add("bubble-appear");

    modeEl.textContent = completed ? "专注完成" : "准备专注";
    hintEl.textContent = completed ? "棒极了！点击开始开启下次专注" : "点击开始专注后解锁投喂";
    startBtn.style.display = "inline-block";
    endBtn.style.display = "none";

    // 专注结束后才把计时器恢复到下一次默认时长。
    remaining = minutes * 60;
    renderTime();

    // 手动提前结束：按照实际已经专注的完整分钟数发放泡泡。
    if (!completed) {
      const earlyReward = focusRewardMinutes(elapsedMinutes, sessionIsMember);

      if (earlyReward > 0) {
        PlayerData.bubbles += earlyReward;
        saveGame();
        renderBubbles();
      }

      completionReward.textContent = `本次专注获得了 ${earlyReward} 泡泡 🫧`;
      completionFlash.classList.add("show");
      completionFlash.setAttribute("aria-hidden","false");
      playCompleteSound();
      if (navigator.vibrate) navigator.vibrate([120,70,180]);
    }

    // 自然完成：按照本次专注的完整分钟数结算。
    if (completed) {
      const reward = focusRewardMinutes(
        Math.floor(durationSeconds / 60),
        sessionIsMember
      );

      if (reward > 0) {
        PlayerData.bubbles += reward;
        saveGame();
        renderBubbles();
      }

      completionReward.textContent = `本次专注获得了 ${reward} 泡泡 🫧`;
      playCompleteSound();
      timer.classList.remove("complete-pulse");
      completionFlash.classList.add("show");
      completionFlash.setAttribute("aria-hidden","false");

      if (navigator.vibrate) navigator.vibrate([120,70,180]);
    }
  }

  let fishStates = [];
  rebuildFishFromData(AquariumData);
  renderBubbles();
  renderAquarium(AquariumData);

  let pellets = [];

  fishStates.forEach(fish => {
    fish.el.addEventListener("pointerdown", (e) => {
      if (!running) return;
      e.stopPropagation();
      playFishStartleSound();
      fish.burstSpeed = 6.0;
    });
  });

  tank.addEventListener("pointerdown", (e) => {
    if (!running) return; 
    if (e.target.closest(".timer, .modal, .audio-controls")) return;

    const rect = tank.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const waterBottom = rect.height * 0.81;

    if (py >= waterBottom) return;

    const pelletEl = document.createElement("div");
    pelletEl.className = "feed-pellet";
    pelletEl.style.left = px + "px";
    pelletEl.style.top = py + "px";
    tank.appendChild(pelletEl);
    playFeedSound();

    pellets.push({ x: px, y: py, el: pelletEl, eaten: false });
  });

  function clamp(val, min, max) {
    return Math.max(min, Math.min(max, val));
  }

  window.addEventListener("resize", () => {
    const rect = tank.getBoundingClientRect();
    const waterBottom = rect.height * 0.81;

    pellets = pellets.filter(p => {
      const isOutOfBounds = p.x > rect.width || p.y > waterBottom;
      if (isOutOfBounds) {
        if (p.el && p.el.parentNode) p.el.remove();
        return false;
      }
      return true;
    });

    fishStates.forEach(fish => {
      fish.x = clamp(fish.x, fish.radius, rect.width - fish.radius);
      fish.y = clamp(fish.y, fish.radius, waterBottom - fish.radius);

      if (fish.targetX > rect.width || fish.targetY > waterBottom) {
        fish.targetX = fish.radius + Math.random() * (rect.width - fish.radius * 2);
        fish.targetY = fish.radius + Math.random() * (waterBottom - fish.radius * 2);
      }
    });
  });

  function getSpeedScale(rect){
    return clamp(rect.width/1440, .45, 1.25);
  }

  function animate() {
    const rect = tank.getBoundingClientRect();
    const speedScale = getSpeedScale(rect);
    const waterBottom = rect.height * 0.81; 

    pellets.forEach(p => {
      if (!p.eaten && p.y < waterBottom) {
        p.y += 0.9; 
        p.el.style.top = p.y + "px";
      }
    });

    fishStates.forEach(fish => {
      let targetX = fish.x, targetY = fish.y;
      let hasFood = false;

      if (fish.eatCooldown > 0) fish.eatCooldown--;

      if (pellets.length > 0 && fish.eatCooldown <= 0) {
        let nearest = null, minDist = Infinity;
        pellets.forEach(p => {
          if (!p.eaten) {
            const d = Math.hypot(p.x - fish.x, p.y - fish.y);
            if (d < minDist) { minDist = d; nearest = p; }
          }
        });

        if (nearest) {
          targetX = nearest.x; 
          targetY = nearest.y; 
          hasFood = true;

          if (minDist < fish.eatDist) {
            nearest.eaten = true;
            nearest.el.classList.add("eaten");
const elemToRemove = nearest.el;
            setTimeout(() => elemToRemove.remove(), 150);

            fish.eatCooldown = 60;
            fish.targetX = fish.radius + Math.random() * (rect.width - fish.radius * 2);
            fish.targetY = fish.radius + Math.random() * (waterBottom - fish.radius * 2);
          }
        }
      }

      if (!hasFood) {
        if (!fish.targetX || Math.hypot(fish.targetX - fish.x, fish.targetY - fish.y) < 30) {
          fish.targetX = fish.radius + Math.random() * (rect.width - fish.radius * 2);
          fish.targetY = fish.radius + Math.random() * (waterBottom - fish.radius * 2);
        }
        targetX = fish.targetX; 
        targetY = fish.targetY;
      }

      const dx = targetX - fish.x;
      const dy = targetY - fish.y;
      const dist = Math.hypot(dx, dy);

      const currentSpeed = (fish.speed + fish.burstSpeed) * speedScale;

      if (dist > 1) {
        fish.x += (dx / dist) * currentSpeed;
        fish.y += (dy / dist) * currentSpeed;
      }

      if (fish.burstSpeed > 0) {
        fish.burstSpeed *= 0.92;
        if (fish.burstSpeed < 0.1) fish.burstSpeed = 0;
      }

      fish.x = clamp(fish.x, fish.radius, rect.width - fish.radius);
      fish.y = clamp(fish.y, fish.radius, waterBottom - fish.radius + 10);

      if (dx < -2) fish.facingLeft = true;
      if (dx > 2) fish.facingLeft = false;

      const slope = clamp(dy / (Math.abs(dx) + 0.1), -0.5, 0.5); 
      let pitchDeg = slope * 30;

      if (fish.facingLeft) {
        fish.el.style.transform = `translate(${fish.x}px, ${fish.y}px) translate(-50%, -50%) rotate(${pitchDeg}deg) scale(${fish.scale}) scaleX(1)`;
      } else {
        fish.el.style.transform = `translate(${fish.x}px, ${fish.y}px) translate(-50%, -50%) rotate(${-pitchDeg}deg) scale(${fish.scale}) scaleX(-1)`;
      }

      fish.swimTime += 0.15 + (fish.burstSpeed * 0.05);
      const tailSwing = Math.sin(fish.swimTime) * (16 + fish.burstSpeed * 2);
      const finSwing = Math.cos(fish.swimTime) * 8;

      if (fish.tailEl) fish.tailEl.style.transform = `rotate(${tailSwing}deg)`;
      if (fish.finEl) fish.finEl.style.transform = `rotate(${26 + finSwing}deg)`;
    });

    pellets = pellets.filter(p => !p.eaten);

    requestAnimationFrame(animate);
  }

  renderTime();
  requestAnimationFrame(animate);

  const audioToggle = document.getElementById("audioToggle");
  if(audioToggle){
    audioToggle.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      // 若浏览器刚才阻止了自动播放，此时按钮会处于 🔇。
      // 第一次点击就是明确的“开启声音”操作。
      setAudioMuted(!audioMuted);
    });
  }

  // 捕获阶段先解锁音频，再交给具体控件处理。
  // 这样点击页面任意位置都能恢复被浏览器拦截的自动播放。

  // v0.11 音频分类调节：保持在同一个主 IIFE 内，避免破坏鱼缸主逻辑。
  const audioSettingsToggle = document.getElementById("audioSettingsToggle");
  const audioSettings = document.getElementById("audioSettings");
  const bgmSlider = document.getElementById("bgmVolume");
  const promptSlider = document.getElementById("promptVolume");
  const sfxSlider = document.getElementById("sfxVolume");

  function updateAudioSettingsUI(){
    const pairs = [
      ["bgm", bgmSlider, document.getElementById("bgmVolumeValue")],
      ["prompt", promptSlider, document.getElementById("promptVolumeValue")],
      ["sfx", sfxSlider, document.getElementById("sfxVolumeValue")]
    ];
    pairs.forEach(([key, slider, value]) => {
      if(slider) slider.value = audioVolumes[key];
      if(value) value.textContent = audioVolumes[key] + "%";
    });
  }

  function setAudioCategoryVolume(category, value){
    const v = Math.max(0, Math.min(100, Number(value)));
    audioVolumes[category] = v;
    localStorage.setItem("fishTank_" + category + "Volume", String(v));
    if (SaveData && SaveData.Settings && SaveData.Settings.audio) {
      SaveData.Settings.audio[category] = v;
      saveGame();
    }

    if(category === "bgm"){
      if(waterAudio && !audioMuted && !waterAudio.paused){
        waterAudio.volume = 0.38 * v / 100 * categoryScale("bgm");
      }
      if(bgmGain && audioCtx){
        bgmGain.gain.setTargetAtTime(v / 100, audioCtx.currentTime, 0.02);
      }
    }else if(category === "prompt"){
      if(promptGain && audioCtx){
        promptGain.gain.setTargetAtTime(v / 100, audioCtx.currentTime, 0.02);
      }
    }else if(category === "sfx"){
      if(sfxGain && audioCtx){
        sfxGain.gain.setTargetAtTime(v / 100, audioCtx.currentTime, 0.02);
      }
    }

    updateAudioSettingsUI();
  }

  updateAudioSettingsUI();

  if(audioSettingsToggle && audioSettings){
    audioSettingsToggle.addEventListener("click", function(e){
      e.preventDefault();
      e.stopPropagation();
      const open = audioSettings.classList.toggle("show");
      audioSettingsToggle.setAttribute("aria-expanded", String(open));
      audioSettings.setAttribute("aria-hidden", String(!open));
    });

    audioSettings.addEventListener("click", function(e){
      e.stopPropagation();
    });

    document.addEventListener("pointerdown", function(e){
      if(!audioSettings.contains(e.target) && e.target !== audioSettingsToggle){
        audioSettings.classList.remove("show");
        audioSettingsToggle.setAttribute("aria-expanded", "false");
        audioSettings.setAttribute("aria-hidden", "true");
      }
    });
  }

  if(bgmSlider){
    bgmSlider.addEventListener("input", function(e){
      setAudioCategoryVolume("bgm", e.target.value);
    });
  }
  if(promptSlider){
    promptSlider.addEventListener("input", function(e){
      setAudioCategoryVolume("prompt", e.target.value);
    });
  }
  if(sfxSlider){
    sfxSlider.addEventListener("input", function(e){
      setAudioCategoryVolume("sfx", e.target.value);
    });
  }

  // 无论配置有没有拉到，首屏都必须渲染出来：
  // 之前失败时整个 then 分支被跳过，鱼缸会一直空白且没有任何提示。
  async function bootstrapConfig(){
    await syncPublishedConfig();
    const bounds = focusDurationBounds();
    minutes = Math.max(bounds.min, Math.min(bounds.max, minutes));
    remaining = minutes * 60;
    durationSeconds = remaining;
    renderTime();
    renderShop();
    renderAquarium(AquariumData);
    updateDevStatus();
  }
  bootstrapConfig();

  const retryButton = document.getElementById("configNoticeRetry");
  if(retryButton) retryButton.addEventListener("click", async () => {
    retryButton.disabled = true;
    retryButton.textContent = "重试中…";
    const ok = await syncPublishedConfig();
    retryButton.disabled = false;
    retryButton.textContent = "重试";
    if(ok){ renderShop(); renderAquarium(AquariumData); }
  });
  const closeButton = document.getElementById("configNoticeClose");
  if(closeButton) closeButton.addEventListener("click", hideConfigNotice);

  window.addEventListener("pointerdown", unlockAudio, {capture:true, passive:true});
  window.addEventListener("keydown", unlockAudio, {once:true});

})();

</script>
</body>
</html>
