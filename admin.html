<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>鱼缸游戏后台管理</title>
	<style>
		:root {
			--ink: #18333a;
			--muted: #70858a;
			--line: #dfe8e6;
			--soft: #f4f8f6;
			--paper: #ffffff;
			--teal: #197d78;
			--teal-dark: #125c5a;
			--coral: #ed8468;
			--yellow: #f4c45b;
			--shadow: 0 14px 40px rgba(24, 51, 58, 0.08);
		}
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: #edf5f1; font: 14px/1.6 "Noto Sans SC", "Microsoft YaHei", sans-serif; }
		button, input, select, textarea { font: inherit; }
		button { cursor: pointer; }
		.app { min-height: 100vh; display: flex; }
		.sidebar { width: 248px; flex: 0 0 248px; padding: 28px 18px; background: #123d42; color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
		.nav-list { flex: 1; }
		.brand { padding: 4px 14px 30px; }
		.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--yellow); color: var(--ink); font-size: 20px; margin-bottom: 13px; }
		.brand h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
		.brand p { margin: 4px 0 0; color: #a8c8c3; font-size: 12px; }
		.nav-label { padding: 0 14px 8px; color: #80aaa5; font-size: 11px; letter-spacing: .13em; }
		.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 10px; color: #c4ddda; background: transparent; text-align: left; margin-bottom: 5px; transition: .2s; }
		.nav-item:hover, .nav-item.active { color: #fff; background: rgba(255,255,255,.12); }
		.nav-icon { width: 20px; text-align: center; font-size: 16px; }
		.nav-item .reserved { margin-left: auto; border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 0 6px; font-size: 10px; color: #9dc0bb; }
		.main { min-width: 0; flex: 1; padding: 34px clamp(24px, 5vw, 72px); }
		.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
		.eyebrow { color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
		h2 { margin: 4px 0 6px; font-size: 30px; letter-spacing: -.03em; }
		.subtitle { margin: 0; color: var(--muted); }
		.button { border: 1px solid transparent; border-radius: 8px; padding: 9px 15px; font-weight: 700; transition: .2s; }
		.button.primary { background: var(--teal); color: white; box-shadow: 0 5px 14px rgba(25,125,120,.18); }
		.button.primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
		.button.secondary { background: white; border-color: var(--line); color: var(--ink); }
		.button.secondary:hover { border-color: var(--teal); color: var(--teal); }
		.button.publish { color: var(--teal); background: #e6f4ef; border-color: #cce9df; }
		.button:disabled { opacity: .42; cursor: not-allowed; transform: none; }
		.panel { background: var(--paper); border: 1px solid rgba(220,232,228,.8); border-radius: 14px; box-shadow: var(--shadow); }
		.panel-head { padding: 19px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 15px; }
		.panel-head h3 { margin: 0; font-size: 16px; }
		.panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; min-width: 690px; }
		th, td { padding: 15px 22px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
		th { background: #fbfcfb; color: var(--muted); font-size: 12px; font-weight: 700; }
		tr:last-child td { border-bottom: 0; }
		.item-name { font-weight: 700; }
		.item-id { color: var(--muted); font-size: 12px; margin-top: 1px; }
		.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; }
		.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
		.badge.published { color: #23836e; background: #e7f6ef; }
		.badge.draft { color: #bf7c27; background: #fff4dd; }
		.actions { display: flex; gap: 8px; }
		.link-button { border: 0; background: transparent; color: var(--teal); padding: 4px; font-weight: 700; }
		.link-button:hover { color: var(--coral); }
		.link-button.delete { color: var(--coral); }
		.link-button.delete:hover { color: #c6533d; }
		.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
		.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
		.form-panel { max-width: 920px; }
		.form-body { padding: 25px 28px 28px; }
		.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px 22px; }
		.field { display: flex; flex-direction: column; gap: 6px; }
		.field.full { grid-column: 1 / -1; }
		label { font-weight: 700; font-size: 13px; }
		label span { color: var(--coral); }
		input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: white; padding: 9px 11px; outline: none; }
		input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(25,125,120,.1); }
		textarea { min-height: 90px; resize: vertical; }
		input[type="checkbox"] { width: auto; accent-color: var(--teal); }
		.check { display: flex; align-items: center; gap: 8px; padding-top: 27px; }
		.hint { color: var(--muted); font-size: 12px; }
		.upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
		.file-button { display: inline-flex; align-items: center; gap: 7px; border: 1px dashed #a9cbc3; border-radius: 7px; padding: 9px 12px; color: var(--teal); background: #f5fbf8; font-weight: 700; cursor: pointer; }
		.file-button input { display: none; }
		.file-list { display: flex; gap: 6px; flex-wrap: wrap; }
		.file-chip { padding: 4px 8px; border-radius: 5px; background: #edf5f1; color: var(--ink); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
		.chip-remove { border: 0; background: transparent; color: #7c8f8c; font-size: 15px; line-height: 1; padding: 0 2px; cursor: pointer; }
		.chip-remove:hover { color: #b4553a; }
		.form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--line); padding-top: 20px; margin-top: 25px; }
		.tier-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr minmax(150px, 1.2fr) 38px; gap: 10px; align-items: end; margin-bottom: 11px; }
		.tier-row .field { min-width: 0; gap: 4px; }
		.tier-row .field input { min-width: 0; }
		.icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--coral); font-size: 18px; }
		.icon-button:hover { background: #fff3ee; }
		.section-title { margin: 25px 0 12px; font-size: 14px; }
		.volume-row { display: flex; align-items: center; gap: 11px; }
		.volume-row input[type="range"] { padding: 0; border: 0; box-shadow: none; accent-color: var(--teal); }
		.volume-row input[type="range"]:focus { box-shadow: none; }
		.volume-value { min-width: 32px; text-align: right; color: var(--teal); font-weight: 700; font-size: 13px; }
		.audio-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 38px; gap: 12px; align-items: end; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--line); }
		.audio-row .field { min-width: 0; gap: 4px; }
		.audio-row .field.full { grid-column: 1 / -2; }
		.audio-row .check { padding-top: 0; }
		.toast { position: fixed; right: 25px; bottom: 25px; z-index: 5; padding: 12px 17px; border-radius: 8px; color: white; background: var(--ink); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s; }
		.toast.show { opacity: 1; transform: translateY(0); }
		.toast.success { background: #246b57; }
		.toast.error { background: #9c4638; }
		.toast.warning { background: #8a641e; }
		.filter-row { display: flex; align-items: end; gap: 12px; flex-wrap: wrap; padding: 0 22px 18px; }
		.filter-row label { min-width: 150px; }
		.filter-row label input, .filter-row label select { margin-top: 5px; }
		.filter-row .count { margin-left: auto; color: var(--muted); font-size: 12px; padding-bottom: 10px; }
		.list-summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
		.summary-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; background: var(--soft); color: var(--muted); font-size: 12px; }
		.summary-chip strong { color: var(--ink); }
		.resource-state { display: inline-flex; align-items: center; gap: 5px; color: #bf7c27; font-size: 12px; }
		.resource-state.ok { color: #23836e; }
		.publish-note { margin: 0 22px 18px; padding: 10px 12px; border-left: 3px solid var(--yellow); background: #fff9eb; color: #765b22; font-size: 12px; }
		.key-status { margin-top: 8px; color: #9dc0bb; font-size: 11px; line-height: 1.45; }
		.key-status.connected { color: #b6f2c8; }
		.key-status.error { color: #ffc4c4; }
		.key-section { margin-top: auto; padding: 16px 14px 4px; border-top: 1px solid rgba(255,255,255,.12); }
		.key-input { width: 100%; border: 1px solid rgba(255,255,255,.2); border-radius: 7px; background: rgba(0,0,0,.15); color: #fff; padding: 8px 10px; font-size: 13px; outline: none; }
		.key-input::placeholder { color: #80aaa5; }
		.key-input:focus { border-color: var(--yellow); }
		.key-btn { width: 100%; margin-top: 8px; border: 0; border-radius: 7px; padding: 8px; font-weight: 700; background: var(--teal); color: white; }
		.key-btn:hover { background: var(--teal-dark); }
		.key-btn.connected { background: #2d7a55; }
		/* ===== 连接状态卡：密钥不是常态操作，连上后就折叠起来 ===== */
		.conn-head { display: flex; align-items: center; gap: 9px; }
		.conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--yellow); flex: 0 0 9px; }
		.conn-dot.connected { background: #39d98a; box-shadow: 0 0 0 3px rgba(57,217,138,.16); }
		.conn-dot.error { background: #ff6b6b; }
		.conn-title { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.25; }
		.conn-sub { font-size: 11px; color: #9dc0bb; line-height: 1.35; }
		.conn-toggle { margin-left: auto; border: 1px solid rgba(255,255,255,.22); background: transparent; color: #c4ddda; border-radius: 6px; padding: 3px 8px; font-size: 11px; white-space: nowrap; }
		.conn-toggle:hover { color: #fff; border-color: rgba(255,255,255,.55); }
		.conn-body { margin-top: 10px; }
		.conn-body[hidden] { display: none; }
		.conn-meta { margin-top: 10px; display: grid; gap: 3px; font-size: 11px; color: #9dc0bb; }
		.conn-meta b { color: #d7ece9; font-weight: 700; word-break: break-all; }
		/* ===== 错误分级：toast 只报成功；能定位的就近说；影响全局的顶到页面上 ===== */
		.error-banner { position: sticky; top: 0; z-index: 30; display: flex; align-items: flex-start; gap: 10px; padding: 12px 18px; background: #8f3a2c; color: #fff; box-shadow: var(--shadow); }
		.error-banner b { font-weight: 700; line-height: 1.55; }
		.error-banner .banner-close { margin-left: auto; flex: 0 0 auto; border: 0; background: transparent; color: #fff; font-size: 20px; line-height: 1; padding: 0 2px; }
		.error-banner[hidden] { display: none; }
		.field-error { color: #b4553a; font-size: 12px; font-weight: 700; }
		.field-error[hidden] { display: none; }
		.form-error { margin: 0 0 16px; padding: 10px 13px; border-left: 3px solid var(--coral); background: #fdf1ed; color: #8f3a2c; font-size: 13px; border-radius: 6px; }
		.form-error[hidden] { display: none; }
		.upload-error { display: block; color: #b4553a; font-size: 12px; font-weight: 700; margin-top: 6px; }
		.upload-error[hidden] { display: none; }
		.invalid { border-color: #c6533d !important; box-shadow: 0 0 0 3px rgba(198,83,61,.12); }
		/* ===== 技术字段收进「高级设置」，默认折叠 ===== */
		.adv { border: 1px dashed #c4dcd5; border-radius: 10px; padding: 11px 15px 15px; background: #fbfdfc; grid-column: 1 / -1; }
		.adv > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--muted); }
		.adv > summary:hover { color: var(--teal); }
		.adv .form-grid { margin-top: 15px; }
		/* ===== 列表行摘要：不用点进去就知道哪里没配好 ===== */
		.row-notes { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; align-items: flex-start; }
		.note-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: #fff4dd; color: #bf7c27; }
		.note-chip.bad { background: #fdeeea; color: #b4553a; }
		.note-chip.info { background: var(--soft); color: var(--muted); }
		/* ===== 保存/发布的状态感 ===== */
		.saved-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 22px 18px; padding: 12px 15px; border-left: 3px solid var(--teal); background: #eef8f3; border-radius: 8px; font-size: 13px; }
		.saved-banner .grow { flex: 1 1 auto; min-width: 0; }
		.saved-banner .button { padding: 6px 12px; font-size: 13px; }
		.saved-banner[hidden] { display: none; }
		/* ===== 发布确认弹窗：发布前先看差异 ===== */
		.modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; background: rgba(16,40,44,.45); padding: 20px; }
		.modal[hidden] { display: none; }
		.modal-card { width: min(600px, 100%); max-height: 86vh; overflow: auto; background: var(--paper); border-radius: 14px; box-shadow: var(--shadow); }
		.modal-head { padding: 20px 22px 0; }
		.modal-head h3 { margin: 0 0 5px; font-size: 17px; }
		.modal-head p { margin: 0; color: var(--muted); font-size: 12px; }
		.modal-body { padding: 16px 22px; }
		.diff-table { width: 100%; border-collapse: collapse; font-size: 12px; }
		.diff-table th, .diff-table td { padding: 7px 9px; border-bottom: 1px solid var(--line); white-space: normal; vertical-align: top; text-align: left; }
		.diff-table th { background: #fbfcfb; }
		.diff-table td.old { color: #a2553f; background: #fdf6f3; word-break: break-all; }
		.diff-table td.new { color: #1d6b58; background: #f2faf6; word-break: break-all; }
		.diff-empty { padding: 16px 0; color: var(--muted); font-size: 13px; }
		.modal-foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding: 0 22px 20px; }
		.modal-foot .hint { margin-right: auto; }
		/* ===== 事件触发的可读预览 ===== */
		.rule-preview { margin: 0 22px 18px; padding: 12px 15px; border-left: 3px solid var(--teal); background: #eef8f3; border-radius: 8px; font-size: 13px; line-height: 1.75; }
		.rule-preview b { color: var(--teal-dark); }
		@media (max-width: 760px) {
			.app { display: block; }
			.sidebar { width: 100%; height: auto; position: static; padding: 14px; }
			.brand { display: flex; align-items: center; gap: 11px; padding: 4px 5px 14px; }
			.brand-mark { margin: 0; }
			.brand p { display: none; }
			.nav-label { display: none; }
			.nav-list { display: flex; overflow-x: auto; gap: 5px; }
			.nav-item { min-width: max-content; width: auto; margin: 0; padding: 9px 11px; }
			.nav-item .reserved { display: none; }
			.main { padding: 25px 16px 45px; }
			.topbar { display: block; }
			.topbar .button { margin-top: 17px; }
			h2 { font-size: 26px; }
			.form-grid { grid-template-columns: 1fr; }
			.field.full { grid-column: auto; }
			.check { padding-top: 0; }
			.tier-row { grid-template-columns: 1fr 1fr; }
			.tier-row .field:nth-child(4) { min-width: 150px; }
			.tier-row .remove-tier { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end; }
		}
	</style>
</head>
<body>
	<div class="error-banner" id="errorBanner" hidden role="alert">
		<b id="errorBannerText"></b>
		<button class="banner-close" id="errorBannerClose" aria-label="关闭错误提示">×</button>
	</div>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<div class="brand-mark">◒</div>
				<div><h1>鱼缸管理台</h1><p>Fishtank Game Admin</p></div>
			</div>
			<div class="nav-label">内容管理</div>
			<nav class="nav-list" id="navList">
				<button class="nav-item active" data-module="decorations"><span class="nav-icon">✦</span>装点鱼缸配置</button>
				<button class="nav-item" data-module="fish"><span class="nav-icon">◉</span>水产装配</button>
			<button class="nav-item" data-module="focus"><span class="nav-icon">◌</span>专注配置</button>
			<button class="nav-item" data-module="audio"><span class="nav-icon">♪</span>音效管理</button>
			<button class="nav-item" data-module="about"><span class="nav-icon">✎</span>关于内容</button>
		<button class="nav-item" data-module="events"><span class="nav-icon">◇</span>事件设置</button>
		<button class="nav-item" data-module="users"><span class="nav-icon">☷</span>玩家管理</button>
			<button class="nav-item" data-module="payment"><span class="nav-icon">▣</span>付费配置 <span class="reserved">预留</span></button>
		</nav>
		<div class="key-section">
			<div class="conn-head">
				<span class="conn-dot" id="connDot"></span>
				<div class="grow-title"><div class="conn-title" id="connTitle">未连接</div><div class="conn-sub" id="connSub">输入密钥后连接 API</div></div>
				<button class="conn-toggle" id="connToggle" type="button">更改密钥</button>
			</div>
			<div class="conn-body" id="connBody">
				<input type="password" id="adminKeyInput" class="key-input" placeholder="输入管理密钥">
				<button class="key-btn" id="adminKeyBtn">连接</button>
			</div>
			<div class="conn-meta" id="connMeta" hidden></div>
			<div class="key-status" id="keyStatus" role="status">未连接 · 输入密钥后连接 API</div>
		</div>
	</aside>
		<main class="main" id="main"></main>
	</div>
	<div class="modal" id="publishDialog" hidden role="dialog" aria-modal="true" aria-labelledby="publishDialogTitle">
		<div class="modal-card" id="publishDialogCard"></div>
	</div>
	<div class="toast" id="toast"></div>

	<script src="config.js"></script>
	<script src="game-data.js"></script>
	<script>
		const SHOP_CATEGORIES = [
			{ value: "fish", label: "鱼" },
			{ value: "decorations", label: "鱼缸装饰" },
			{ value: "backgrounds", label: "背景" },
			{ value: "sands", label: "沙子" },
			{ value: "sounds", label: "白噪音" }
		];
		// 内置兜底数据来自 game-data.js（与 index.html 共用同一份），后台才是权威数据源。
		// 这里的默认值仅在配置接口不可用时使用，正常情况下会被 loadAdminData() 整体覆盖。
		const DEFAULT_DATA = window.FISHTANK_DEFAULT_DATA || { shopItems: [], fishAssembly: [], focusConfig: { minFocusDuration: 25, maxFocusDuration: 120, rewardTiers: [] } };
		const DEFAULT_AUDIO = {
			categories: {
				bgm: { label: "背景白噪音", enabled: true, volume: 38 },
				prompt: { label: "提示音", enabled: true, volume: 100 },
				sfx: { label: "交互音效", enabled: true, volume: 100 }
			},
			sounds: [
				{ id: "water-ambient", name: "海水白噪音", category: "bgm", enabled: true, volume: 100, resourcePath: "assets/sounds/water-ambient.mp3", loop: true },
				{ id: "focus-start", name: "开始专注", category: "prompt", enabled: true, volume: 100, resourcePath: "" },
				{ id: "focus-complete", name: "专注完成", category: "prompt", enabled: true, volume: 100, resourcePath: "" },
				{ id: "feed", name: "投喂饲料", category: "sfx", enabled: true, volume: 100, resourcePath: "" },
				{ id: "fish-startle", name: "鱼儿受惊", category: "sfx", enabled: true, volume: 100, resourcePath: "" }
			]
		};
		const state = {
			module: "decorations",
			decorations: (DEFAULT_DATA.shopItems || []).map(item => ({ ...item, resourcePath: item.resourcePath ? [item.resourcePath] : [], tags: [], published: true, dirty: false })),
			fish: (DEFAULT_DATA.fishAssembly || []).map(item => ({ ...item, published: true, dirty: false })),
			focus: JSON.parse(JSON.stringify(DEFAULT_DATA.focusConfig || { minFocusDuration: 25, maxFocusDuration: 120, rewardTiers: [] })),
			audio: JSON.parse(JSON.stringify(DEFAULT_AUDIO)),
			about: null,
			events: [],
			users: [],
			trackSummary: null

				const key = input.dataset.category;
				if (!categories[key]) categories[key] = { label: key, enabled: true, volume: 100 };
				if (input.dataset.prop === "enabled") categories[key].enabled = input.checked;
				else if (input.dataset.prop === "label") categories[key].label = input.value.trim() || key;
				else if (input.dataset.prop === "volume") categories[key].volume = Number(input.value);
			});
			const sounds = [...document.querySelectorAll(".audio-row")].map(row => {
				const value = prop => row.querySelector(`[data-prop="${prop}"]`);
				return { id: value("id").value.trim(), name: value("name").value.trim(), category: value("category").value, enabled: value("enabled").checked, volume: Number(value("volume").value), resourcePath: value("resourcePath").value.trim(), loop: state.audio.sounds[Number(row.dataset.index)]?.loop === true };

			const categoryKeys = Object.keys(categories);
			if (!categoryKeys.length) errors.push("至少要保留一个音效分类");
			categoryKeys.forEach(key => { if (!/^[A-Za-z0-9_-]{1,32}$/.test(key)) errors.push(`分类 key 不合法：${key}`); });
			if (sounds.some(sound => !sound.id || !sound.name)) errors.push("每个音效都必须填写编号和名称");
			if (new Set(sounds.map(sound => sound.id)).size !== sounds.length) errors.push("音效编号不允许重复");
			if (sounds.some(sound => !categoryKeys.includes(sound.category))) errors.push("音效的分类必须是已定义的分类之一");
			if (sounds.some(sound => !Number.isFinite(sound.volume) || sound.volume < 0 || sound.volume > 100)) errors.push("音效音量必须在 0-100 之间");
			Object.entries(categories).forEach(([key, category]) => { if (!Number.isFinite(Number(category.volume)) || category.volume < 0 || category.volume > 100) errors.push(`分类 ${key} 的音量必须在 0-100 之间`); });

			const trackHtml = !state.trackSummary
				? `<div class="empty"><strong>埋点概览暂不可用</strong>接口失败或 tracking_events 表还没建；不影响本页其它功能。</div>`
				: `<div class="table-wrap"><table><thead><tr><th>事件</th><th>今日</th><th>最近 7 天</th><th>累计</th></tr></thead><tbody>${state.trackSummary.map(row => `<tr><td>${esc(TRACK_LABELS[row.event] || row.event)}</td><td>${row.today}</td><td>${row.last7d}</td><td>${row.total}</td></tr>`).join("")}</tbody></table></div>`;
			main.innerHTML = pageHeader("PLAYER MANAGEMENT", "玩家管理", "按注册时间从早到晚排序；可按 cohort 与赞赏状态筛选，赞赏者单独高亮。", `<button class="button secondary" id="exportSavesJson">导出全量存档</button><button class="button primary" id="exportUsersCsv">导出 CSV</button>`)
				+ `<section class="panel"><div class="panel-head"><div><h3>埋点概览</h3><p>打开 / 开始专注 / 完成专注 / 购买成功</p></div></div>${trackHtml}</section>`
				+ `<section class="panel"><div class="panel-head"><div><h3>筛选</h3></div></div><div class="filter-row">
					<label>cohort <select id="filterCohort">${cohortOptions}</select></label>
					<label>赞赏状态 <select id="filterSupporter">${supporterOptions}</select></label>
					<button class="button secondary" id="applyUserFilter">应用筛选</button>
					<span class="count">共 ${state.users.length} 人（赞赏者 ${supporters}）</span>
				</div></section>`
				+ `<section class="panel"><div class="panel-head"><div><h3>玩家列表</h3><p>按注册时间从早到晚</p></div></div>${tableHtml}</section>`;
			document.getElementById("exportUsersCsv").onclick = exportUsersCsv;
			document.getElementById("exportSavesJson").onclick = exportSavesJson;
			document.getElementById("applyUserFilter").onclick = async () => {
				userFilter.cohort = document.getElementById("filterCohort").value;
				userFilter.isSupporter = document.getElementById("filterSupporter").value;
				await loadUsers();
				renderUserList();
			};
		}
		// CSV 单元格转义：含逗号/引号/换行的用双引号包住并把内部引号翻倍（RFC 4180）。
		function csvCell(value) {
			const s = String(value ?? "");
			return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
		}
		function exportUsersCsv() {
			if (!state.users.length) { showToast("没有可导出的数据"); return; }
			const header = ["userId", "nickname", "cohort", "createdAt", "isSupporter", "supporterNote", "focusCount", "focusMinutesTotal", "fishCount"];
			const lines = [header.join(",")];
			for (const u of state.users) {
				const cells = [u.userId, u.nickname || "", u.cohort || "", u.createdAt ? new Date(u.createdAt).toISOString() : "", u.isSupporter ? "true" : "false", u.supporterNote || "", u.focusCount, u.focusMinutesTotal, u.fishCount];
				lines.push(cells.map(csvCell).join(","));
			}
			// ﻿(BOM) 让 Excel 正确识别 UTF-8，否则中文会乱码。
			const csv = "﻿" + lines.join("\r\n");
			const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
			const url = URL.createObjectURL(blob);
			const a = document.createElement("a");
			a.href = url;
			a.download = `fishtank-users-${new Date().toISOString().slice(0, 10)}.csv`;
			document.body.appendChild(a);
			a.click();
			a.remove();
			URL.revokeObjectURL(url);
			showToast(`已导出 ${state.users.length} 名玩家`);
		}
		// 全量存档导出（备份用）。走 /admin/saves/export —— 受 x-admin-key 保护，
		// 返回的是**全部玩家的存档**，不是上面那份玩家列表，两者别混。
		// 文件落到浏览器下载目录，之后由本机备份脚本 / 手工转存到异地磁盘。
		async function exportSavesJson() {
			try {
				const body = await apiRequest("/admin/saves/export");
				const payload = body.data || {};
				if (!payload.saves || !payload.saves.length) { showToast("还没有存档可导出"); return; }
				// 文件名带秒级时间：一天里导出多次不会互相覆盖。
				const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
				const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8;" });
				const url = URL.createObjectURL(blob);
				const a = document.createElement("a");
				a.href = url;
				a.download = `fishtank-saves-${stamp}.json`;
				document.body.appendChild(a);
				a.click();
				a.remove();
				URL.revokeObjectURL(url);
				showToast(`已导出 ${payload.saves.length} 份存档`);
			} catch (error) {
				showToast(`存档导出失败：${error.message}`);
			}
		}
		function formData(form) { const data = Object.fromEntries(new FormData(form).entries()); data.isMemberOnly = form.elements.isMemberOnly?.checked || false; data.price = Number(data.price || 0); data.maxInventory = Number(data.maxInventory || 0); return data; }
		async function publishItem(type, index) {
			const item = state[type][index];
			const id = type === "fish" ? item.fishid : item.id;
			// 发布前先看差异再确认 —— 确认动作本身在弹窗里完成。
			if (!await openPublishDialog(item, item.name || id)) return;
			try {
				const response = await apiRequest(`/admin/${type}/${encodeURIComponent(id)}/publish`, { method: "POST" });
				// 发布接口返回的是发布后的完整记录：把 publishedData 同步成刚发的内容，
				// 否则界面上的「草稿 vs 线上」对比用的还是发布前的旧数据。
				if (response && response.data) Object.assign(item, toEditableRecord(response.data));
				item.dirty = false; item.published = true;
				lastSaved = null;
				showToast("内容已发布");
			} catch (error) { showToast(`发布失败：${error.message}`); return; }
			// 渲染放在 try 外面：渲染出错不该被报成「发布失败」（发布其实已经成功了），
			// 那会让人以为接口挂了、往错的方向查。
			renderModule();
		}
		document.getElementById("navList").onclick = event => { const button = event.target.closest(".nav-item"); if (!button) return; if (!confirmLeave()) return; state.module = button.dataset.module; editingIndex = null; setLeaveGuard(null); render(); };
		function connectWithKey() {
			adminKey = adminKeyInput.value.trim();
			if (adminKey) sessionStorage.setItem("fishtank_admin_key", adminKey);
			else sessionStorage.removeItem("fishtank_admin_key");
			setConnectionState("", "正在连接 · 读取配置");
			loadAdminData().then(() => {
				lastSyncedAt = Date.now();
				setConnectionState("connected", "已连接 · 配置已同步");
				refreshConnEnv();
				// 连上就收起密钥框 —— 密钥不是常态操作，别让它一直占着侧边栏。
				collapseConnBody();
				clearErrorBanner();
				render();
			}).catch(error => {
				setConnectionState("error", `连接失败 · ${error.message}`);
				showErrorBanner(`连接后台失败：${error.message}。请确认管理密钥与 API 地址，改好后重试。`);
				render();
			});
		}
		adminKeyBtn.onclick = connectWithKey;
		adminKeyInput.addEventListener("keydown", event => { if (event.key === "Enter") connectWithKey(); });
		if (adminKey) {
			loadAdminData().then(() => { lastSyncedAt = Date.now(); setConnectionState("connected", "已连接 · 配置已同步"); refreshConnEnv(); collapseConnBody(); render(); })
				.catch(error => { setConnectionState("error", `连接失败 · ${error.message}`); showErrorBanner(`连接后台失败：${error.message}。请确认管理密钥与 API 地址，改好后重试。`); render(); });
		} else { setConnectionState("", "未连接 · 输入密钥后连接 API"); refreshConnEnv(); render(); showToast("请输入管理密钥后点击连接", 4000, "warning"); }
	</script>
</body>
</html>
