<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>鱼缸游戏后台管理</title>
	<style>
		:root {
			--ink: #18333a;
			--muted: #70858a;
			--line: #dfe8e6;
			--soft: #f4f8f6;
			--paper: #ffffff;
			--teal: #197d78;
			--teal-dark: #125c5a;
			--coral: #ed8468;
			--yellow: #f4c45b;
			--shadow: 0 14px 40px rgba(24, 51, 58, 0.08);
		}
		* { box-sizing: border-box; }
		body { margin: 0; color: var(--ink); background: #edf5f1; font: 14px/1.6 "Noto Sans SC", "Microsoft YaHei", sans-serif; }
		button, input, select, textarea { font: inherit; }
		button { cursor: pointer; }
		.app { min-height: 100vh; display: flex; }
		.sidebar { width: 248px; flex: 0 0 248px; padding: 28px 18px; background: #123d42; color: #fff; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
		.nav-list { flex: 1; }
		.brand { padding: 4px 14px 30px; }
		.brand-mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: var(--yellow); color: var(--ink); font-size: 20px; margin-bottom: 13px; }
		.brand h1 { margin: 0; font-size: 19px; letter-spacing: .04em; }
		.brand p { margin: 4px 0 0; color: #a8c8c3; font-size: 12px; }
		.nav-label { padding: 0 14px 8px; color: #80aaa5; font-size: 11px; letter-spacing: .13em; }
		.nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-radius: 10px; color: #c4ddda; background: transparent; text-align: left; margin-bottom: 5px; transition: .2s; }
		.nav-item:hover, .nav-item.active { color: #fff; background: rgba(255,255,255,.12); }
		.nav-icon { width: 20px; text-align: center; font-size: 16px; }
		.nav-item .reserved { margin-left: auto; border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 0 6px; font-size: 10px; color: #9dc0bb; }
		.main { min-width: 0; flex: 1; padding: 34px clamp(24px, 5vw, 72px); }
		.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
		.eyebrow { color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
		h2 { margin: 4px 0 6px; font-size: 30px; letter-spacing: -.03em; }
		.subtitle { margin: 0; color: var(--muted); }
		.button { border: 1px solid transparent; border-radius: 8px; padding: 9px 15px; font-weight: 700; transition: .2s; }
		.button.primary { background: var(--teal); color: white; box-shadow: 0 5px 14px rgba(25,125,120,.18); }
		.button.primary:hover { background: var(--teal-dark); transform: translateY(-1px); }
		.button.secondary { background: white; border-color: var(--line); color: var(--ink); }
		.button.secondary:hover { border-color: var(--teal); color: var(--teal); }
		.button.publish { color: var(--teal); background: #e6f4ef; border-color: #cce9df; }
		.button:disabled { opacity: .42; cursor: not-allowed; transform: none; }
		.panel { background: var(--paper); border: 1px solid rgba(220,232,228,.8); border-radius: 14px; box-shadow: var(--shadow); }
		.panel-head { padding: 19px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 15px; }
		.panel-head h3 { margin: 0; font-size: 16px; }
		.panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
		.table-wrap { overflow-x: auto; }
		table { width: 100%; border-collapse: collapse; min-width: 690px; }
		th, td { padding: 15px 22px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
		th { background: #fbfcfb; color: var(--muted); font-size: 12px; font-weight: 700; }
		tr:last-child td { border-bottom: 0; }
		.item-name { font-weight: 700; }
		.item-id { color: var(--muted); font-size: 12px; margin-top: 1px; }
		.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 12px; }
		.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
		.badge.published { color: #23836e; background: #e7f6ef; }
		.badge.draft { color: #bf7c27; background: #fff4dd; }
		.actions { display: flex; gap: 8px; }
		.link-button { border: 0; background: transparent; color: var(--teal); padding: 4px; font-weight: 700; }
		.link-button:hover { color: var(--coral); }
		.link-button.delete { color: var(--coral); }
		.link-button.delete:hover { color: #c6533d; }
		.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
		.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
		.form-panel { max-width: 920px; }
		.form-body { padding: 25px 28px 28px; }
		.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 19px 22px; }
		.field { display: flex; flex-direction: column; gap: 6px; }
		.field.full { grid-column: 1 / -1; }
		label { font-weight: 700; font-size: 13px; }
		label span { color: var(--coral); }
		input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: white; padding: 9px 11px; outline: none; }
		input:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(25,125,120,.1); }
		textarea { min-height: 90px; resize: vertical; }
		input[type="checkbox"] { width: auto; accent-color: var(--teal); }
		.check { display: flex; align-items: center; gap: 8px; padding-top: 27px; }
		.hint { color: var(--muted); font-size: 12px; }
		.upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
		.file-button { display: inline-flex; align-items: center; gap: 7px; border: 1px dashed #a9cbc3; border-radius: 7px; padding: 9px 12px; color: var(--teal); background: #f5fbf8; font-weight: 700; cursor: pointer; }
		.file-button input { display: none; }
		.file-list { display: flex; gap: 6px; flex-wrap: wrap; }
		.file-chip { padding: 4px 8px; border-radius: 5px; background: #edf5f1; color: var(--ink); font-size: 12px; }
		.form-foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; border-top: 1px solid var(--line); padding-top: 20px; margin-top: 25px; }
		.tier-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr minmax(150px, 1.2fr) 38px; gap: 10px; align-items: end; margin-bottom: 11px; }
		.tier-row .field { min-width: 0; gap: 4px; }
		.tier-row .field input { min-width: 0; }
		.icon-button { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 7px; background: white; color: var(--coral); font-size: 18px; }
		.icon-button:hover { background: #fff3ee; }
		.section-title { margin: 25px 0 12px; font-size: 14px; }
		.volume-row { display: flex; align-items: center; gap: 11px; }
		.volume-row input[type="range"] { padding: 0; border: 0; box-shadow: none; accent-color: var(--teal); }
		.volume-row input[type="range"]:focus { box-shadow: none; }
		.volume-value { min-width: 32px; text-align: right; color: var(--teal); font-weight: 700; font-size: 13px; }
		.audio-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) 38px; gap: 12px; align-items: end; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--line); }
		.audio-row .field { min-width: 0; gap: 4px; }
		.audio-row .field.full { grid-column: 1 / -2; }
		.audio-row .check { padding-top: 0; }
		.toast { position: fixed; right: 25px; bottom: 25px; z-index: 5; padding: 12px 17px; border-radius: 8px; color: white; background: var(--ink); box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s; }
		.toast.show { opacity: 1; transform: translateY(0); }
		.key-section { margin-top: auto; padding: 16px 14px 4px; border-top: 1px solid rgba(255,255,255,.12); }
		.key-input { width: 100%; border: 1px solid rgba(255,255,255,.2); border-radius: 7px; background: rgba(0,0,0,.15); color: #fff; padding: 8px 10px; font-size: 13px; outline: none; }
		.key-input::placeholder { color: #80aaa5; }
		.key-input:focus { border-color: var(--yellow); }
		.key-btn { width: 100%; margin-top: 8px; border: 0; border-radius: 7px; padding: 8px; font-weight: 700; background: var(--teal); color: white; }
		.key-btn:hover { background: var(--teal-dark); }
		.key-btn.connected { background: #2d7a55; }
		@media (max-width: 760px) {
			.app { display: block; }
			.sidebar { width: 100%; height: auto; position: static; padding: 14px; }
			.brand { display: flex; align-items: center; gap: 11px; padding: 4px 5px 14px; }
			.brand-mark { margin: 0; }
			.brand p { display: none; }
			.nav-label { display: none; }
			.nav-list { display: flex; overflow-x: auto; gap: 5px; }
			.nav-item { min-width: max-content; width: auto; margin: 0; padding: 9px 11px; }
			.nav-item .reserved { display: none; }
			.main { padding: 25px 16px 45px; }
			.topbar { display: block; }
			.topbar .button { margin-top: 17px; }
			h2 { font-size: 26px; }
			.form-grid { grid-template-columns: 1fr; }
			.field.full { grid-column: auto; }
			.check { padding-top: 0; }
			.tier-row { grid-template-columns: 1fr 1fr; }
			.tier-row .field:nth-child(4) { min-width: 150px; }
			.tier-row .remove-tier { grid-column: 2; grid-row: 1 / span 2; align-self: center; justify-self: end; }
		}
	</style>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand">
				<div class="brand-mark">◒</div>
				<div><h1>鱼缸管理台</h1><p>Fishtank Game Admin</p></div>
			</div>
			<div class="nav-label">内容管理</div>
			<nav class="nav-list" id="navList">
				<button class="nav-item active" data-module="decorations"><span class="nav-icon">✦</span>装点鱼缸配置</button>
				<button class="nav-item" data-module="fish"><span class="nav-icon">◉</span>水产装配</button>
			<button class="nav-item" data-module="focus"><span class="nav-icon">◌</span>专注配置</button>
			<button class="nav-item" data-module="audio"><span class="nav-icon">♪</span>音效管理</button>
			<button class="nav-item" data-module="events"><span class="nav-icon">◇</span>事件设置 <span class="reserved">预留</span></button>
				<button class="nav-item" data-module="payment"><span class="nav-icon">▣</span>付费配置 <span class="reserved">预留</span></button>
		</nav>
		<div class="key-section">
			<div class="nav-label">管理密钥</div>
			<input type="password" id="adminKeyInput" class="key-input" placeholder="输入管理密钥">
			<button class="key-btn" id="adminKeyBtn">连接</button>
		</div>
	</aside>
		<main class="main" id="main"></main>
	</div>
	<div class="toast" id="toast"></div>

	<script>
		const SHOP_CATEGORIES = [
			{ value: "fish", label: "鱼" },
			{ value: "decorations", label: "鱼缸装饰" },
			{ value: "backgrounds", label: "背景" },
			{ value: "sands", label: "沙子" },
			{ value: "sounds", label: "白噪音" }
		];
		const OLD_SHOP_ITEMS = [
			{ id: "fish001", category: "fish", name: "小丑鱼", description: "色彩明亮的小丑鱼，为鱼缸增添一点活泼的海洋气息。", previewImage: "assets/fish/fish001_preview.webp", price: 30, resourcePath: "assets/fish/fish001.webp", isMemberOnly: false, maxInventory: 50 },
			{ id: "fish002", category: "fish", name: "蓝尾鱼", description: "带着蓝色尾鳍的小鱼，游动时看起来清爽又灵巧。", previewImage: "assets/fish/fish002_preview.webp", price: 35, resourcePath: "assets/fish/fish002.webp", isMemberOnly: false, maxInventory: 50 },
			{ id: "fish003", category: "fish", name: "金色小鱼", description: "闪着金色光泽的小鱼，让鱼缸多一点温暖的亮色。", previewImage: "assets/fish/fish003_preview.webp", price: 45, resourcePath: "assets/fish/fish003.webp", isMemberOnly: true, maxInventory: 50 },
			{ id: "decoration001", category: "decorations", name: "水草", description: "柔软舒展的基础水草，适合打造自然的鱼缸底景。", previewImage: "assets/plants/plant001_preview.webp", price: 20, resourcePath: "assets/plants/plant001.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "decoration002", category: "decorations", name: "细叶水草", description: "细长挺拔的水草，让鱼缸拥有更丰富的层次。", previewImage: "assets/plants/plant002_preview.webp", price: 30, resourcePath: "assets/plants/plant002.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "decoration003", category: "decorations", name: "红色水草", description: "带有红色叶片的水草，为水下景色加入一抹醒目的颜色。", previewImage: "assets/plants/plant003_preview.webp", price: 50, resourcePath: "assets/plants/plant003.webp", isMemberOnly: true, maxInventory: 1 },
			{ id: "background001", category: "backgrounds", name: "浅海晨光", description: "明亮柔和的浅海背景，像阳光落在清澈的海水里。", previewImage: "assets/backgrounds/background001_preview.webp", price: 30, resourcePath: "assets/backgrounds/background001.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "background002", category: "backgrounds", name: "深海夜色", description: "深沉安静的海底夜色，适合营造宁静的晚间氛围。", previewImage: "assets/backgrounds/background002_preview.webp", price: 60, resourcePath: "assets/backgrounds/background002.webp", isMemberOnly: true, maxInventory: 1 },
			{ id: "background003", category: "backgrounds", name: "珊瑚黄昏", description: "带着珊瑚色调的黄昏海景，让鱼缸显得温暖而梦幻。", previewImage: "assets/backgrounds/background003_preview.webp", price: 50, resourcePath: "assets/backgrounds/background003.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "sand001", category: "sands", name: "暖色细沙", description: "温暖细腻的浅色沙地，适合作为基础鱼缸底景。", previewImage: "assets/sands/sand001_preview.webp", price: 20, resourcePath: "assets/sands/sand001.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "sand002", category: "sands", name: "深海黑沙", description: "沉静的深色沙地，让鱼缸整体显得更加深邃。", previewImage: "assets/sands/sand002_preview.webp", price: 35, resourcePath: "assets/sands/sand002.webp", isMemberOnly: false, maxInventory: 1 },
			{ id: "sound001", category: "sounds", name: "海水白噪音", description: "轻柔的水下环境声，让专注时的鱼缸更加安静。", previewImage: "assets/sounds/sound001_preview.webp", price: 25, resourcePath: "assets/sounds/sound001.mp3", isMemberOnly: false, maxInventory: 1 },
			{ id: "sound002", category: "sounds", name: "轻柔气泡声", description: "细碎轻盈的气泡声，为专注时光增加一点流动感。", previewImage: "assets/sounds/sound002_preview.webp", price: 40, resourcePath: "assets/sounds/sound002.mp3", isMemberOnly: true, maxInventory: 1 }
		];
		const DEFAULT_AUDIO = {
			categories: {
				bgm: { label: "背景白噪音", enabled: true, volume: 38 },
				prompt: { label: "提示音", enabled: true, volume: 100 },
				sfx: { label: "交互音效", enabled: true, volume: 100 }
			},
			sounds: [
				{ id: "water-ambient", name: "海水白噪音", category: "bgm", enabled: true, volume: 100, resourcePath: "assets/sounds/water-ambient.mp3", loop: true },
				{ id: "focus-start", name: "开始专注", category: "prompt", enabled: true, volume: 100, resourcePath: "" },
				{ id: "focus-complete", name: "专注完成", category: "prompt", enabled: true, volume: 100, resourcePath: "" },
				{ id: "feed", name: "投喂饲料", category: "sfx", enabled: true, volume: 100, resourcePath: "" },
				{ id: "fish-startle", name: "鱼儿受惊", category: "sfx", enabled: true, volume: 100, resourcePath: "" }
			]
		};
		const state = {
			module: "decorations",
			decorations: OLD_SHOP_ITEMS.map(item => ({ ...item, resourcePath: item.resourcePath ? [item.resourcePath] : [], tags: "", published: true, dirty: false })),
			fish: [
				{ fishid: "fish001", name: "小丑鱼", resourcePath: "assets/fish/clownfish.png", movementCode: "gentle-swim", scaleMin: 0.8, scaleMax: 1.1, feedReaction: true, published: true, dirty: false },
				{ fishid: "fish002", name: "蓝尾鱼", resourcePath: "assets/fish/blue-tang.png", movementCode: "quick-swim", scaleMin: 0.7, scaleMax: 1.0, feedReaction: true, published: true, dirty: false }
			],
			focus: { minFocusDuration: 25, maxFocusDuration: 120, rewardTiers: [
				{ id: "tier-1", endMinute: 25, normalBubblePerMinute: 1, memberBubblePerMinute: 2 },
				{ id: "tier-2", endMinute: 60, normalBubblePerMinute: 2, memberBubblePerMinute: 3 },
				{ id: "tier-3", endMinute: 120, normalBubblePerMinute: 3, memberBubblePerMinute: 5 }
			]},
			audio: JSON.parse(JSON.stringify(DEFAULT_AUDIO))
		};
		let editingIndex = null;
		let editingType = null;
		let focusPublished = true;
		let focusDirty = false;
		let audioPublished = true;
		let audioDirty = false;
		const API_BASE = window.FISHTANK_API_BASE || "https://focus-aquarium-api-316509-5-1491495221.sh.run.tcloudbase.com/api";

		const main = document.getElementById("main");
		const toast = document.getElementById("toast");
		const categoryLabel = value => SHOP_CATEGORIES.find(category => category.value === value)?.label || value;
		const resourceList = value => Array.isArray(value) ? value : (value ? [value] : []);
		const esc = value => String(value ?? "").replace(/[&<>\"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[char]));
		let adminKey = sessionStorage.getItem("fishtank_admin_key") || "";
		const adminKeyInput = document.getElementById("adminKeyInput");
		const adminKeyBtn = document.getElementById("adminKeyBtn");
		if (adminKey) { adminKeyInput.value = adminKey; adminKeyBtn.textContent = "已连接"; adminKeyBtn.classList.add("connected"); }
		async function apiRequest(path, options = {}) {
			const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
			if (adminKey) headers["x-admin-key"] = adminKey;
			const response = await fetch(`${API_BASE}${path}`, { ...options, headers });
			if (response.status === 401) { adminKeyBtn.classList.remove("connected"); adminKeyBtn.textContent = "连接"; throw new Error("管理密钥无效或缺失"); }
			const body = response.status === 204 ? null : await response.json();
			if (!response.ok) throw new Error(body?.error || "API 请求失败");
			return body;
		}
		function applyRecords(records, type) {
			return records.map(record => ({ ...record.data, published: record.published, dirty: !record.published }));
		}
		async function loadAdminData() {
			const [decorations, fish, focus, audio] = await Promise.all([
				apiRequest("/admin/decorations"),
				apiRequest("/admin/fish"),
				apiRequest("/admin/focus"),
				apiRequest("/admin/audio")
			]);
			state.decorations = applyRecords(decorations.data, "decorations");
			state.fish = applyRecords(fish.data, "fish");
			if (focus.data[0]) {
				state.focus = { ...focus.data[0].data };
				focusPublished = focus.data[0].published;
				focusDirty = !focusPublished;
			}
			if (audio.data[0]) {
				state.audio = JSON.parse(JSON.stringify(audio.data[0].data));
				audioPublished = audio.data[0].published;
				audioDirty = !audioPublished;
			}
		}
		function showToast(message) { toast.textContent = message; toast.classList.add("show"); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400); }
		function pageHeader(kicker, title, description, action = "") { return `<div class="topbar"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p class="subtitle">${description}</p></div>${action}</div>`; }
		function render() { document.querySelectorAll(".nav-item").forEach(item => item.classList.toggle("active", item.dataset.module === state.module)); renderModule(); }
		function renderModule() {
			if (state.module === "decorations") renderDecorationList();
			if (state.module === "fish") renderFishList();
			if (state.module === "focus") renderFocus();
			if (state.module === "audio") renderAudio();
			if (state.module === "events" || state.module === "payment") renderPlaceholder();
		}

				showToast("音效配置已保存，等待发布");
				renderAudio();
			} catch (error) { showToast(`保存失败：${error.message}`); }
		}
		function renderPlaceholder() { const title = state.module === "events" ? "事件设置" : "付费配置"; main.innerHTML = pageHeader(state.module === "events" ? "EVENT SETTINGS" : "PAYMENT CONFIG", title, "该模块将在后续版本中接入。", "") + `<section class="panel"><div class="empty"><strong>功能预留中</strong>这里暂时没有可配置内容。</div></section>`; }
		function formData(form) { const data = Object.fromEntries(new FormData(form).entries()); data.isMemberOnly = form.elements.isMemberOnly?.checked || false; data.price = Number(data.price || 0); data.maxInventory = Number(data.maxInventory || 0); return data; }
		async function publishItem(type, index) { const item = state[type][index]; const id = type === "fish" ? item.fishid : item.id; try { await apiRequest(`/admin/${type}/${encodeURIComponent(id)}/publish`, { method: "POST" }); item.dirty = false; item.published = true; showToast("内容已发布"); renderModule(); } catch (error) { showToast(`发布失败：${error.message}`); } }
		document.getElementById("navList").onclick = event => { const button = event.target.closest(".nav-item"); if (!button) return; state.module = button.dataset.module; editingIndex = null; render(); };
		function connectWithKey() {
			adminKey = adminKeyInput.value.trim();
			if (adminKey) sessionStorage.setItem("fishtank_admin_key", adminKey);
			else sessionStorage.removeItem("fishtank_admin_key");
			loadAdminData().then(() => { adminKeyBtn.textContent = "已连接"; adminKeyBtn.classList.add("connected"); render(); }).catch(error => { adminKeyBtn.classList.remove("connected"); adminKeyBtn.textContent = "连接"; showToast(`连接失败：${error.message}`); render(); });
		}
		adminKeyBtn.onclick = connectWithKey;
		adminKeyInput.addEventListener("keydown", event => { if (event.key === "Enter") connectWithKey(); });
		if (adminKey) { loadAdminData().then(() => { render(); }).catch(error => { showToast(`API 连接失败：${error.message}`); adminKeyBtn.classList.remove("connected"); adminKeyBtn.textContent = "连接"; render(); }); }
		else { render(); showToast("请输入管理密钥后点击连接"); }
	</script>
</body>
</html>
